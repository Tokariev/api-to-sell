services:
  caddy:
    image: caddy:2-alpine
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./caddy/Caddyfile.dev:/etc/caddy/Caddyfile
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - sample-nestjs
      - sample-python

  sample-nestjs:
    build:
      context: ../services/sample-nestjs
    volumes:
      - ../services/sample-nestjs/src:/app/src
    environment:
      - PORT=3000
      - DATABASE_URL=postgresql://postgres:postgres@postgres:5432/api_to_sell
    depends_on:
      - postgres

  sample-python:
    build:
      context: ../services/sample-python
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload
    volumes:
      - ../services/sample-python/app:/app/app
    environment:
      - ROOT_PATH=/sample-python-docs
      - DATABASE_URL=postgresql://postgres:postgres@postgres:5432/api_to_sell
    depends_on:
      - postgres

  postgres:
    image: postgres:16-alpine
    environment:
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=postgres
      - POSTGRES_DB=api_to_sell
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

volumes:
  caddy_data:
  caddy_config:
  postgres_data:
