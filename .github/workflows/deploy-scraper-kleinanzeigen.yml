name: Deploy Scraper Kleinanzeigen

on:
  push:
    branches: [main]
    paths:
      - "services/scraper-kleinanzeigen/**"
      - "!services/scraper-kleinanzeigen/**.md"

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: services/scraper-kleinanzeigen
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - run: pip install -r requirements.txt

      - run: pytest -v

  build-and-push:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - uses: docker/setup-buildx-action@v3

      - uses: docker/build-push-action@v5
        with:
          context: services/scraper-kleinanzeigen
          push: true
          cache-from: type=gha
          cache-to: type=gha,mode=max
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/scraper-kleinanzeigen:latest
            ${{ secrets.DOCKERHUB_USERNAME }}/scraper-kleinanzeigen:${{ github.sha }}
