name: Deploy Sample Python

on:
  push:
    branches: [main]
    paths:
      - "services/sample-python/**"
      - "!services/sample-python/**.md"

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - uses: docker/setup-buildx-action@v3

      - uses: docker/build-push-action@v5
        with:
          context: services/sample-python
          push: true
          cache-from: type=gha
          cache-to: type=gha,mode=max
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/sample-python:latest
            ${{ secrets.DOCKERHUB_USERNAME }}/sample-python:${{ github.sha }}
